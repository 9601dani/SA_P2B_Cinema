server:
  port: ${PORT:8083}
  error:
    include-message: always
    include-binding-errors: always

  servlet:
    context-path: /api/cinema

logging:
  level:
    root: warn
    org:
      springframework:
        web: debug
        data:
          rest: debug

spring:
  application:
    name: cinema-service

  datasource:
    username: ${DB_USER}
    password: ${DB_PASS}
    url: jdbc:postgresql://${DB_HOST}/${DB_DATABASE}

  jackson:
    time-zone: "America/Guatemala"
    mapper:
      "[ACCEPT_CASE_INSENSITIVE_ENUMS]": true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASS}
    virtual-host: ${RABBIT_VHOST}
    ssl:
      enabled: true

security:
  rsa:
    public-key: classpath:certs/public-key.pem

client:
  services:
    auth-identity: ${AUTH-IDENTITY_URL:http://localhost:8081}
    movie: ${MOVIE_URL:http://localhost:8084}
    promotion: ${PROMOTION_URL:http://localhost:8089}

rabbitmq:
  exchange:
    showTime: showTime.exchange
    wallet: wallet.exchange
    ticket: ticket.exchange
    stateTicket: stateTicket.exchange

  routing:
    showTime_created: showTime.created
    wallet_created: wallet.created
    ticket_created: ticket.created
    stateTicket_created: stateTicket.created

  queues:
    stateTicket_created_notify: stateTicket.created.queue